name: "Bug Report"
description: Report a problem with Vercel Stadium
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include your environment and steps to reproduce when you can.
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: e.g. Node 24, pnpm 11, macOS 15, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - WebSocket connection / upgrade / reconnects
        - Movement, collision or prediction
        - The Coach (AI answers, docs tools)
        - 3D scene / rendering / performance
        - Chat, HUD or the entry flow
        - Local dev (crossws)
        - Deployment (Vercel)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a link to a minimal repo.
    validations:
      required: true
